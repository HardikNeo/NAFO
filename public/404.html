<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | NAFO</title>

      }

        color: #1c5d65;

      }

      }

    <div class="wrap">
