name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # Firebase web config is committed in `.env.production` (public values).
      # Leaving an empty `env:` block here would override it with blank strings
      # and silently disable Firestore, so the build reads the file instead.
      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FINANCIAL_INITIATIVES_NEPAL }}
          channelId: live
          projectId: financial-initiatives-nepal

      # Deploy Firestore security rules so collections like `team` are readable.
      # Runs after hosting so a permissions issue here can't block the site deploy.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FINANCIAL_INITIATIVES_NEPAL }}

      - name: Deploy Firestore rules
        run: |
          set +e
          npx firebase deploy --only firestore:rules --project financial-initiatives-nepal --non-interactive 2>&1 | tee rules-deploy.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(tail -n 25 rules-deploy.log | tr '\n' '~' | tr -d '%' | cut -c1-900)
            echo "::error title=Firestore rules deploy failed::${msg}"
          fi
          exit $code
