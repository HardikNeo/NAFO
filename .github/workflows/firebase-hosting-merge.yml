name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Prints the service account that deploys for this repo (not sensitive).
      # Grant it the "Firebase Rules Admin" role to enable automatic rule deploys.
      - name: Show CI service account
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FINANCIAL_INITIATIVES_NEPAL }}
        run: |
          email=$(printf '%s' "$SA_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('client_email',''))" 2>/dev/null || true)
          echo "::notice title=CI service account::${email:-unknown}"

      - name: Install dependencies
        run: npm ci

      # Firebase web config is committed in `.env.production` (public values).
      # Leaving an empty `env:` block here would override it with blank strings
      # and silently disable Firestore, so the build reads the file instead.
      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FINANCIAL_INITIATIVES_NEPAL }}
          channelId: live
          projectId: financial-initiatives-nepal

      # Deploy Firestore security rules (notices, messages, team) automatically.
      # If the service account lacks the "Firebase Rules Admin" role this step
      # warns instead of failing, so Hosting deploys are never blocked. Once the
      # role is granted it deploys rules on every push with no further changes.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        continue-on-error: true
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FINANCIAL_INITIATIVES_NEPAL }}

      - name: Deploy Firestore rules
        continue-on-error: true
        run: |
          set +e
          npx firebase deploy --only firestore:rules --project financial-initiatives-nepal --non-interactive 2>&1 | tee rules-deploy.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(tail -n 25 rules-deploy.log | tr '\n' '~' | tr -d '%' | cut -c1-900)
            echo "::warning title=Firestore rules not deployed::${msg}"
          fi
          exit $code
